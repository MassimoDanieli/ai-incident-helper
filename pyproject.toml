[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-incident-helper"
version = "2.0.0"
description = "Incident timelines, TTD/TTM/TTR metrics and blameless AI post-mortems"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Massimo Danieli" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
ai = ["anthropic>=0.40", "openai>=1.40"]
app = ["streamlit>=1.40", "pandas>=2.2", "plotly>=5.24"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
incident-helper = "incident_helper.__main__:main"

[tool.setuptools]
packages = ["incident_helper"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
